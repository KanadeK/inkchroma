name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.20"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python and locked environment
        run: |
          uv python install 3.11
          uv sync --locked --group dev --python 3.11

      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(uv run --locked --python 3.11 python -c 'import inkchroma; print(inkchroma.__version__)')"
          if [[ "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${package_version}" >&2
            exit 1
          fi

      - name: Run the release gate unchanged
        run: uv run --locked --python 3.11 python scripts/check.py

      - name: Publish formal GitHub Release and assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            "dist/inkchroma-${version}-py3-none-any.whl" \
            "dist/inkchroma-${version}.tar.gz" \
            "dist/inkchroma-examples-v${version}.zip" \
            --verify-tag \
            --title "InkChroma ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            --latest
